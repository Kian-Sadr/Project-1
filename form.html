<!DOCTYPE html>
<html>
  <head>
    <title>Project 1 Form</title>
  </head>
  <body>
    <h1>Form Page</h1>
    <br>
    <br>
    <a href="index.html">Home Page Link</a>
    <br>
    <br>
    <form>
      <fieldset>
        <legend>Patriot's Form</legend>
        <fieldset>
          Is America the best?
          <br>
          <input type="radio" id="Yes" name="rating" value="Yes"></input>
          <label for="Yes">Yes</label>
          <br>
          <input type="radio" id="Absolutely" name="rating" value="Absolutely"></input>
          <label for="Absolutely">Absolutely</label>
          <br>
          <input type="radio" id="Merica" name="rating" value="Merica"></input>
          <label for="Merica">'MERICA!!!</label>
        </fieldset>
        <fieldset>
          <label for="message">Write why you love America:</label>
          <br>
          <textarea name="message" id="message" rows="10" cols="50"></textarea>
        </fieldset>
        <fieldset>
          <label for="ID">User ID: </label>
          <input type="text" id="ID" name="ID" maxlength="20">
          <br>
          <label for="secret">Account Password:</label>
          <input type="Password" name="Secret" id="Secret" size="15" maxlength="10" required>
        </fieldset>
        <fieldset>
          <button type="button">Submit</button>
          <input type="submit" value="Complete">
        </fieldset>
      </fieldset>
    </form>
  </body>
</html>
